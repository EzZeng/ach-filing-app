appId: tw.twnch.ach-filing
productName: ACH-Filing
copyright: Copyright © 2026
directories:
  output: release
  buildResources: electron/build
files:
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
extraResources:
  - from: dist-electron/renderer
    to: renderer
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "ACH-Filing-${version}-win-${arch}.${ext}"
portable:
  artifactName: "ACH-Filing-${version}-portable.exe"
linux:
  target:
    - AppImage
    - zip
mac:
  target:
    - zip
